<!doctype html>
<html lang="it">
  <body style="margin:0;padding:32px 16px;background:#f5f6f3;font-family:Helvetica,Arial,sans-serif;color:#1f2328">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;padding:32px">
      <tr><td>
        <p style="margin:0 0 24px;font-family:Georgia,serif;font-size:20px">Campionario</p>
        <p style="margin:0 0 8px;font-size:15px">Il tuo codice per entrare:</p>
        <p style="margin:0 0 24px;font-size:32px;letter-spacing:6px;font-weight:bold">{{ .Token }}</p>
        <p style="margin:0 0 24px;font-size:15px;line-height:22px">
          Scrivilo nella pagina di accesso, oppure apri il link da questo dispositivo:<br>
          <a href="{{ .ConfirmationURL }}" style="color:#2d4a6b">Entra in Campionario</a>
        </p>
        <p style="margin:0;font-size:13px;color:#5e645c">Il codice vale un'ora. Se non hai chiesto tu di entrare, ignora questa email.</p>
      </td></tr>
    </table>
  </body>
</html>
